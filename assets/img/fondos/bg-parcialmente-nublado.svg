<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Fondo atmosférico parcialmente nublado en El Salvador">
  <defs>
    <linearGradient id="sky-pn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#11467C"/>
      <stop offset="42%" stop-color="#298CE2"/>
      <stop offset="78%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <radialGradient id="pn-sun-glow" cx="72%" cy="24%" r="32%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.88"/>
      <stop offset="35%" stop-color="#FBBF24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pn-cloud-soft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#DBEAFE" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="pn-ridge-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4776A8" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#1E4B7A" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="pn-ridge-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E4A76" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0F335A" stop-opacity="0.96"/>
    </linearGradient>
  </defs>

  <!-- Cielo azul institucional con claridad cálida -->
  <rect width="1920" height="1080" fill="url(#sky-pn)"/>
  <rect width="1920" height="1080" fill="url(#pn-sun-glow)"/>
  <circle cx="1382" cy="256" r="56" fill="#FEF9C3" opacity="0.86"/>

  <!-- Cumulus suaves en distintas capas -->
  <g fill="url(#pn-cloud-soft)">
    <path d="M120 345c0-38 32-68 72-68 12 0 24 3 34 8 18-48 66-82 122-82 68 0 124 49 132 114 38 6 68 38 68 78 0 12-3 22-8 32H132c-8-10-12-22-12-36v-46z" opacity="0.72"/>
    <path d="M1110 355c0-32 28-58 64-58 10 0 20 2 29 7 18-45 64-77 118-77 62 0 113 42 124 98 42 5 75 38 75 79 0 9-2 17-5 25h-395c-7-9-10-20-10-32v-42z" opacity="0.78"/>
    <path d="M640 445c0-24 22-44 50-44 14-30 46-50 84-50 44 0 82 28 92 66 28 4 50 26 50 53H644c-3-8-4-16-4-25z" opacity="0.5"/>
  </g>

  <!-- Siluetas volcánicas lejanas -->
  <path d="M0 770 L260 692 L485 732 L725 568 C746 554 774 554 795 568 L995 712 L1235 654 L1455 588 C1472 583 1490 584 1506 592 L1725 718 L1920 690 L1920 1080 L0 1080 Z" fill="url(#pn-ridge-1)"/>

  <!-- Cordillera frontal y lago / costa -->
  <path d="M0 845 L210 785 L425 818 L630 706 C650 695 674 695 694 706 L915 824 L1175 768 L1425 815 L1680 742 L1920 792 L1920 1080 L0 1080 Z" fill="url(#pn-ridge-2)"/>

  <!-- Superficie serena de agua costera -->
  <rect x="0" y="925" width="1920" height="155" fill="#0D355F" opacity="0.92"/>
  <path d="M0 970 C320 946 580 990 920 1030 C1280 1072 1620 1005 1920 988 L1920 1080 L0 1080 Z" fill="#082442" opacity="0.82"/>
</svg>
