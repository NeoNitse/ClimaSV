<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Fondo atmosférico de lluvia sobre paisaje volcánico salvadoreño">
  <defs>
    <linearGradient id="sky-rain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B2239"/>
      <stop offset="38%" stop-color="#1E3F63"/>
      <stop offset="76%" stop-color="#44698B"/>
      <stop offset="100%" stop-color="#7594B0"/>
    </linearGradient>
    <linearGradient id="rain-cloud-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#1E3A5F" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="rain-volc-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#315273" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#16324F" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="rain-volc-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#173657" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0A1E33" stop-opacity="0.98"/>
    </linearGradient>
  </defs>

  <!-- Cielo lluvioso -->
  <rect width="1920" height="1080" fill="url(#sky-rain)"/>

  <!-- Bóveda densa de nubes de lluvia -->
  <path d="M0 0 H1920 V290 C1760 320 1580 265 1380 305 C1150 350 960 270 720 312 C490 352 250 282 0 322 Z" fill="url(#rain-cloud-top)"/>
  <path d="M0 0 H1920 V190 C1720 232 1480 165 1210 212 C950 258 680 178 410 222 C230 250 110 225 0 205 Z" fill="#0F253E" opacity="0.52"/>

  <!-- Trazos sutiles de lluvia diagonal -->
  <g stroke="#BAE6FD" stroke-width="2" stroke-linecap="round" opacity="0.22">
    <line x1="160" y1="240" x2="110" y2="410"/>
    <line x1="340" y1="310" x2="290" y2="480"/>
    <line x1="520" y1="220" x2="470" y2="390"/>
    <line x1="710" y1="350" x2="660" y2="520"/>
    <line x1="890" y1="250" x2="840" y2="420"/>
    <line x1="1080" y1="320" x2="1030" y2="490"/>
    <line x1="1270" y1="210" x2="1220" y2="380"/>
    <line x1="1460" y1="340" x2="1410" y2="510"/>
    <line x1="1640" y1="260" x2="1590" y2="430"/>
    <line x1="1810" y1="310" x2="1760" y2="480"/>
    <line x1="250" y1="530" x2="200" y2="700"/>
    <line x1="610" y1="510" x2="560" y2="680"/>
    <line x1="990" y1="540" x2="940" y2="710"/>
    <line x1="1360" y1="500" x2="1310" y2="670"/>
    <line x1="1730" y1="520" x2="1680" y2="690"/>
  </g>

  <!-- Cadena volcánica bajo lluvia -->
  <path d="M0 790 L260 725 L510 752 L755 590 C776 576 802 576 824 590 L1065 740 L1320 676 L1545 595 C1565 588 1588 589 1606 599 L1810 718 L1920 702 L1920 1080 L0 1080 Z" fill="url(#rain-volc-1)"/>
  <path d="M0 860 L230 795 L490 835 L720 735 L980 822 L1260 755 L1540 818 L1780 765 L1920 795 L1920 1080 L0 1080 Z" fill="url(#rain-volc-2)"/>

  <!-- Agua lluviosa en la costa -->
  <rect x="0" y="942" width="1920" height="138" fill="#07182B" opacity="0.92"/>
  <g stroke="#64B5F6" stroke-width="2" opacity="0.16">
    <line x1="280" y1="980" x2="540" y2="980"/>
    <line x1="820" y1="1008" x2="1140" y2="1008"/>
    <line x1="1380" y1="974" x2="1640" y2="974"/>
  </g>
</svg>
