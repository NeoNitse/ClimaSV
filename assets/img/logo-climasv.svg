<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 68" width="236" height="68" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">ClimaSV — Logotipo Institucional</title>
  <desc id="logoDesc">Ícono minimalista de sol ámbar detrás de una nube azul estilizada junto al texto ClimaSV.</desc>
  <defs>
    <linearGradient id="climasv-sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="55%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="climasv-cloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="48%" stop-color="#1E88E5"/>
      <stop offset="100%" stop-color="#0F3D6E"/>
    </linearGradient>
    <linearGradient id="climasv-cloud-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Isotipo: Sol estilizado + nube institucional -->
  <g id="isotipo" transform="translate(4, 4)">
    <!-- Rayos solares minimalistas -->
    <g stroke="#F59E0B" stroke-width="2.8" stroke-linecap="round">
      <line x1="39" y1="5" x2="39" y2="9.5"/>
      <line x1="51.5" y1="9.8" x2="48.3" y2="13"/>
      <line x1="56.5" y1="22" x2="52" y2="22"/>
      <line x1="26.5" y1="9.8" x2="29.7" y2="13"/>
    </g>

    <!-- Disco solar -->
    <circle cx="39" cy="22.5" r="10.5" fill="url(#climasv-sun)"/>

    <!-- Nube estilizada en primer plano -->
    <path d="M16.5 50.5h29.5c5.8 0 10.5-4.5 10.5-10.1 0-5.1-3.9-9.3-8.9-10-1.4-7.4-8-12.9-15.8-12.9-7.6 0-14 5.2-15.6 12.3-5.3.6-9.5 5-9.5 10.4 0 5.7 4.4 10.3 9.8 10.3z" fill="url(#climasv-cloud)"/>

    <!-- Brillo interior sutil de la nube -->
    <path d="M22.5 29.5c1.8-4.7 6.3-7.8 11.5-7.8 4.6 0 8.6 2.5 10.7 6.2" fill="none" stroke="url(#climasv-cloud-highlight)" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Onda atmosférica inferior en ámbar -->
    <path d="M15 56h18" stroke="#F59E0B" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M37 56h7" stroke="#1E88E5" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <!-- Logotipo tipográfico -->
  <g id="wordmark" transform="translate(72, 0)">
    <text x="0" y="42" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.8">
      <tspan fill="#0F3D6E">Clima</tspan><tspan fill="#1E88E5">SV</tspan>
    </text>
    <!-- Subtítulo institucional discreto -->
    <text x="2" y="57" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="600" letter-spacing="2.1" fill="#475569">EL SALVADOR</text>
    <!-- Detalle de acento bajo SV -->
    <rect x="90" y="47.5" width="44" height="3" rx="1.5" fill="#F59E0B"/>
  </g>
</svg>
