<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Tormenta eléctrica">
  <defs>
    <linearGradient id="storm-cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F3D6E"/>
    </linearGradient>
    <linearGradient id="storm-bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Nube de tormenta profunda -->
  <path d="M15.5 38h31c5.2 0 9.5-4.1 9.5-9.1 0-4.6-3.5-8.4-8.1-9-1.3-6.6-7.3-11.6-14.5-11.6-7 0-12.8 4.7-14.3 11.1-5 .6-8.9 4.5-8.9 9.5 0 5.1 2.4 9.1 5.3 9.1z" fill="url(#storm-cloud)" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Trazo de lluvia acompañando la tormenta -->
  <g stroke="#38BDF8" stroke-width="3.2" stroke-linecap="round">
    <line x1="19" y1="44" x2="16" y2="51.5"/>
    <line x1="46.5" y1="44" x2="43.5" y2="51.5"/>
  </g>

  <!-- Rayo central en ámbar solar -->
  <polygon points="34,32 24.5,46 31.8,46 28.5,58 41,42.5 33.8,42.5" fill="url(#storm-bolt)" stroke="#B45309" stroke-width="1.4" stroke-linejoin="round"/>
</svg>
