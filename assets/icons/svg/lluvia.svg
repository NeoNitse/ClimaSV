<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Lluvia">
  <defs>
    <linearGradient id="rain-cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="55%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="rain-drop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1E88E5"/>
    </linearGradient>
  </defs>

  <!-- Nube de precipitación -->
  <path d="M15.5 39h31c5.2 0 9.5-4.1 9.5-9.2 0-4.6-3.5-8.4-8.1-9-1.3-6.7-7.3-11.8-14.5-11.8-7 0-12.8 4.8-14.3 11.2-5 .6-8.9 4.6-8.9 9.6 0 5.1 2.4 9.2 5.3 9.2z" fill="url(#rain-cloud)" stroke="#0F3D6E" stroke-width="2" stroke-linejoin="round"/>

  <!-- Brillo superior suave -->
  <path d="M22 20.5c1.5-3.8 5.3-6.3 9.7-6.3" fill="none" stroke="#F8FAFC" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Gotas de lluvia vectoriales consistentes -->
  <g stroke="url(#rain-drop)" stroke-width="3.6" stroke-linecap="round">
    <line x1="21" y1="45" x2="17.5" y2="53.5"/>
    <line x1="31.5" y1="45" x2="28" y2="56"/>
    <line x1="42" y1="45" x2="38.5" y2="53.5"/>
  </g>
</svg>
